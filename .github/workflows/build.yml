name: build
on: [push, pull_request]
jobs:
  target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build
      - run: cmake -B build-arm -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
      - run: cmake --build build-arm
  pc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build-pc -DPC_BUILD=ON
      - run: cmake --build build-pc
      - run: ctest --test-dir build-pc --output-on-failure
